apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: labor-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harrye900/parker.git
    targetRevision: HEAD
    path: argocd-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: canary-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
